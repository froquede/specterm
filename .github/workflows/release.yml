name: Release

# Publishes installable builds for the version being released:
#   • Linux    → AppImage + .deb
#   • Windows  → NSIS installer (.exe)
#   • macOS    → .dmg + .zip (Apple-silicon, unsigned)
#
# Triggered by pushing a semantic-version tag (vMAJOR.MINOR.FIX, e.g. v0.2.0).
# The tag drives the GitHub Release and electron-builder uploads each platform's
# artifacts onto it. `workflow_dispatch` allows a manual re-run for a tag.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:

permissions:
  contents: write

# A re-pushed tag (or a manual re-run) supersedes any in-flight run for the
# same ref — cancel the old one so we don't pay for two builds of one release.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            build_args: "--linux AppImage deb"
          - os: windows-latest
            build_args: "--win nsis"
          - os: macos-latest
            build_args: "--mac dmg zip"
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # electron-builder rebuilds node-pty for Electron's ABI via node-gyp.
      # Runners ship Python 3.12, which dropped the `distutils` module node-gyp
      # still imports — pin 3.11 so the native rebuild works (fixes the macOS
      # "No module named 'distutils'" failure).
      - name: Install Python 3.11 for node-gyp
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Cache the Electron binary + electron-builder's tooling downloads (FPM,
      # AppImage runtime, NSIS, etc.) so they aren't re-fetched every release.
      # Keyed on the lockfile (which pins the Electron version); paths that
      # don't exist on a given OS are simply skipped by actions/cache.
      - name: Cache Electron & electron-builder downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: ${{ runner.os }}-electron-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-electron-

      - name: Install dependencies
        run: npm ci

      # node-pty pulls an ancient node-gyp (9.x) that only detects VS 2013/2015,
      # so the Windows rebuild fails with "Could not find any Visual Studio
      # installation". Drop a VS2022-aware node-gyp 10 into node_modules for the
      # Windows runner only — @electron/rebuild resolves the hoisted copy, and 10
      # is the version electron-builder 25's @electron/rebuild expects (node-gyp
      # 11 deadlocks it). Other OSes build fine with the bundled node-gyp.
      - name: Use VS2022-aware node-gyp (Windows)
        if: runner.os == 'Windows'
        run: npm install --no-save node-gyp@10

      - name: Build renderer (Vite)
        run: npm run build

      - name: Build & publish Electron installer
        run: npx electron-builder ${{ matrix.build_args }} --publish always
        env:
          # Lets electron-builder create/attach assets to the tag's Release.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No Apple Developer cert in CI — skip signing so the mac build runs.
          CSC_IDENTITY_AUTO_DISCOVERY: false
          GYP_MSVS_VERSION: "2022"

  # After every platform has uploaded its installers, rewrite the Release body
  # with a per-platform downloads table that links to each uploaded asset.
  notes:
    needs: release
    # Run whenever builds finished (even if one platform failed, so the table
    # still lists what published) — but not if the run was cancelled.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Write downloads table into the release body
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          base="https://github.com/$REPO/releases/download/$TAG"

          # Pull the asset names actually attached to this release, dropping
          # updater metadata (.blockmap / latest*.yml) that users never download.
          assets=$(gh release view "$TAG" --repo "$REPO" --json assets \
            --jq '.assets[].name | select(endswith(".blockmap") or endswith(".yml") | not)')

          row() { # $1=label  $2=glob
            for a in $assets; do
              case "$a" in
                $2) echo "| $1 | [\`$a\`]($base/$a) |" ;;
              esac
            done
          }

          {
            echo "## Downloads"
            echo
            echo "| Platform | File |"
            echo "| --- | --- |"
            row "macOS (Apple silicon)" "*-mac-*.dmg"
            row "macOS (Apple silicon, zip)" "*-mac-*.zip"
            row "Windows (installer)" "*.exe"
            row "Linux (AppImage)" "*.AppImage"
            row "Linux (Debian/Ubuntu)" "*.deb"
            echo
            echo "_Built by the release workflow from tag \`$TAG\`._"
          } > body.md

          gh release edit "$TAG" --repo "$REPO" --notes-file body.md
