name: Release

# Publishes installable builds for the version being released:
#   • Linux    → AppImage + .deb
#   • Windows  → NSIS installer (.exe)
#   • macOS    → .dmg + .zip (Apple-silicon, unsigned)
#
# Triggered by pushing a semantic-version tag (vMAJOR.MINOR.FIX, e.g. v0.2.0).
# The tag drives the GitHub Release and electron-builder uploads each platform's
# artifacts onto it. `workflow_dispatch` allows a manual re-run for a tag.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            build_args: "--linux AppImage deb"
          - os: windows-latest
            build_args: "--win nsis"
          - os: macos-latest
            build_args: "--mac dmg zip"
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # electron-builder rebuilds node-pty for Electron's ABI via node-gyp.
      # Runners ship Python 3.12, which dropped the `distutils` module node-gyp
      # still imports — pin 3.11 so the native rebuild works (fixes the macOS
      # "No module named 'distutils'" failure).
      - name: Install Python 3.11 for node-gyp
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # On Windows, point node-gyp at the runner's Visual Studio 2022 so it
      # finds the MSVC toolchain (fixes "Could not find any Visual Studio
      # installation to use").
      - name: Configure MSVC for node-gyp (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          npm install --global node-gyp@11.2.0
          npm config set node_gyp "$(npm root -g)/node-gyp/bin/node-gyp.js"
          npm config set msvs_version 2022

      - name: Install dependencies
        run: npm ci

      - name: Build renderer (Vite)
        run: npm run build

      - name: Build & publish Electron installer
        run: npx electron-builder ${{ matrix.build_args }} --publish always
        env:
          # Lets electron-builder create/attach assets to the tag's Release.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No Apple Developer cert in CI — skip signing so the mac build runs.
          CSC_IDENTITY_AUTO_DISCOVERY: false
          GYP_MSVS_VERSION: "2022"
