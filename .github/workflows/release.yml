name: Release

# Publishes installable builds for the version being released:
#   • Linux    → AppImage + .deb   (built in an Ubuntu 20.04 container so the
#                                   native node-pty links against glibc 2.31 and
#                                   runs on Ubuntu 20.04+; the runner image's
#                                   newer glibc would break older distros)
#   • Windows  → NSIS installer (.exe)   (uses node-pty's shipped N-API prebuild)
#   • macOS    → .dmg + .zip (Apple-silicon, unsigned)
#
# node-pty is N-API (ABI-stable), so its prebuilt binaries run on Electron as-is.
# Windows therefore skips the native rebuild entirely (npmRebuild=false), which
# sidesteps node-gyp/Visual Studio detection. Linux has no prebuild, so it
# compiles from source inside the container; macOS rebuilds against Electron.
#
# Triggered by pushing a semantic-version tag (vMAJOR.MINOR.FIX, e.g. v0.6.0).
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:

permissions:
  contents: write

# A re-pushed tag (or a manual re-run) supersedes any in-flight run for the
# same ref — cancel the old one so we don't pay for two builds of one release.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            container: ubuntu:20.04
            build_args: "--linux AppImage deb"
          - os: windows-latest
            build_args: "--win nsis --config.npmRebuild=false"
          - os: macos-latest
            build_args: "--mac dmg zip"
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    env:
      # Let appimagetool run without FUSE (unavailable in the container).
      APPIMAGE_EXTRACT_AND_RUN: "1"

    steps:
      # The ubuntu:20.04 container is barebones — install the toolchain the
      # later actions and the node-pty compile need. Building here pins the
      # native binary to glibc 2.31, so it runs on Ubuntu 20.04 and newer.
      - name: Install build toolchain (Linux container)
        if: matrix.container
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            git curl ca-certificates xz-utils file \
            build-essential python3 gcc-10 g++-10 \
            fakeroot dpkg libfuse2
          # Ubuntu 20.04's default g++ is 9 (no -std=gnu++20, which node-pty
          # needs). Use g++-10 for the native compile; glibc stays 2.31, so the
          # binary still runs on Ubuntu 20.04+.
          echo "CC=gcc-10" >> "$GITHUB_ENV"
          echo "CXX=g++-10" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # macOS rebuilds node-pty via node-gyp; the runner's Python 3.12 dropped
      # `distutils`, so pin 3.11. Linux uses the container's python3 (3.8, which
      # still ships distutils); Windows uses the prebuild and never builds.
      - name: Install Python 3.11 for node-gyp (macOS)
        if: runner.os == 'macOS'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Cache the Electron binary + electron-builder tooling downloads so they
      # aren't re-fetched every release. Paths absent on a given OS are skipped.
      - name: Cache Electron & electron-builder downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: ${{ runner.os }}-electron-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-electron-

      - name: Install dependencies
        run: npm ci

      - name: Build renderer (Vite)
        run: npm run build

      - name: Build & publish Electron installer
        run: npx electron-builder ${{ matrix.build_args }} --publish always
        env:
          # Lets electron-builder create/attach assets to the tag's Release.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No Apple Developer cert in CI — skip signing so the mac build runs.
          CSC_IDENTITY_AUTO_DISCOVERY: false

  # After every platform has uploaded its installers, rewrite the Release body
  # with a per-platform downloads table that links to each uploaded asset.
  notes:
    needs: release
    # Run whenever builds finished (even if one platform failed, so the table
    # still lists what published) — but not if the run was cancelled.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Write downloads table into the release body
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          base="https://github.com/$REPO/releases/download/$TAG"

          # Pull the asset names actually attached to this release, dropping
          # updater metadata (.blockmap / latest*.yml) that users never download.
          assets=$(gh release view "$TAG" --repo "$REPO" --json assets \
            --jq '.assets[].name | select(endswith(".blockmap") or endswith(".yml") | not)')

          row() { # $1=label  $2=glob
            for a in $assets; do
              case "$a" in
                $2) echo "| $1 | [\`$a\`]($base/$a) |" ;;
              esac
            done
          }

          {
            echo "## Downloads"
            echo
            echo "| Platform | File |"
            echo "| --- | --- |"
            row "macOS (Apple silicon)" "*-mac-*.dmg"
            row "macOS (Apple silicon, zip)" "*-mac-*.zip"
            row "Windows (installer)" "*.exe"
            row "Linux (AppImage)" "*.AppImage"
            row "Linux (Debian/Ubuntu)" "*.deb"
            echo
            echo "_Built by the release workflow from tag \`$TAG\`. Linux builds"
            echo "target glibc 2.31 (Ubuntu 20.04+)._"
          } > body.md

          gh release edit "$TAG" --repo "$REPO" --notes-file body.md
