name: Release

# Publishes installable builds for the version being released:
#   • Linux    → AppImage + .deb   (built in an Ubuntu 20.04 container so the
#                                   native node-pty links against glibc 2.31 and
#                                   runs on Ubuntu 20.04+; the runner image's
#                                   newer glibc would break older distros)
#   • Windows  → NSIS installer (.exe)   (uses node-pty's shipped N-API prebuild)
#   • macOS    → .dmg + .zip (Apple-silicon, unsigned)
#
# node-pty is N-API (ABI-stable), so its prebuilt binaries run on Electron as-is.
# Windows therefore skips the native rebuild entirely (npmRebuild=false), which
# sidesteps node-gyp/Visual Studio detection. Linux has no prebuild, so it
# compiles from source inside the container; macOS rebuilds against Electron.
#
# Triggered by pushing a semantic-version tag (vMAJOR.MINOR.FIX, e.g. v0.6.0).
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:

permissions:
  contents: write

# A re-pushed tag (or a manual re-run) supersedes any in-flight run for the
# same ref — cancel the old one so we don't pay for two builds of one release.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            container: ubuntu:20.04
            build_args: "--linux AppImage deb"
          - os: windows-latest
            build_args: "--win nsis --config.npmRebuild=false"
          - os: macos-latest
            build_args: "--mac dmg zip"
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    env:
      # Let appimagetool run without FUSE (unavailable in the container).
      APPIMAGE_EXTRACT_AND_RUN: "1"

    steps:
      # The ubuntu:20.04 container is barebones — install the toolchain the
      # later actions and the node-pty compile need. Building here pins the
      # native binary to glibc 2.31, so it runs on Ubuntu 20.04 and newer.
      - name: Install build toolchain (Linux container)
        if: matrix.container
        run: |
          # Ubuntu's apt mirrors have transient outages; a single failed fetch
          # here otherwise kills the whole Linux leg (and, on a tag re-push,
          # leaves the release with no Linux artifacts). Retry both update and
          # install a few times before giving up.
          retry() {
            for attempt in 1 2 3 4 5; do
              "$@" && return 0
              echo "apt attempt $attempt failed; retrying in 15s..." >&2
              sleep 15
            done
            return 1
          }
          retry apt-get update
          retry apt-get install -y --no-install-recommends \
            git curl ca-certificates xz-utils file \
            build-essential python3 gcc-10 g++-10 \
            fakeroot dpkg libfuse2
          # Ubuntu 20.04's default g++ is 9 (no -std=gnu++20, which node-pty
          # needs). Use g++-10 for the native compile; glibc stays 2.31, so the
          # binary still runs on Ubuntu 20.04+.
          echo "CC=gcc-10" >> "$GITHUB_ENV"
          echo "CXX=g++-10" >> "$GITHUB_ENV"

          # The runner images ship `gh`, but this container doesn't — and the
          # "Ensure built artifacts are attached" step below is a bash `gh`
          # call, so without this the Linux leg fails at the very step that
          # exists to stop the Linux artifacts going missing (v0.14.0 went red
          # here after its artifacts had already uploaded). Installed from the
          # release tarball rather than the apt repo: one pinned download, no
          # keyring/sources dance, and it goes through the same retry.
          GH_CLI_VERSION=2.63.2
          retry curl -fsSL -o /tmp/gh.tar.gz \
            "https://github.com/cli/cli/releases/download/v${GH_CLI_VERSION}/gh_${GH_CLI_VERSION}_linux_amd64.tar.gz"
          tar -xzf /tmp/gh.tar.gz -C /tmp
          install -m 0755 "/tmp/gh_${GH_CLI_VERSION}_linux_amd64/bin/gh" /usr/local/bin/gh
          gh --version

      - uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # macOS rebuilds node-pty via node-gyp; the runner's Python 3.12 dropped
      # `distutils`, so pin 3.11. Linux uses the container's python3 (3.8, which
      # still ships distutils); Windows uses the prebuild and never builds.
      - name: Install Python 3.11 for node-gyp (macOS)
        if: runner.os == 'macOS'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Cache the Electron binary + electron-builder tooling downloads so they
      # aren't re-fetched every release. Paths absent on a given OS are skipped.
      - name: Cache Electron & electron-builder downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: ${{ runner.os }}-electron-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-electron-

      - name: Install dependencies
        run: npm ci

      - name: Build renderer (Vite)
        run: npm run build

      - name: Build & publish Electron installer
        run: npx electron-builder ${{ matrix.build_args }} --publish always
        env:
          # Lets electron-builder create/attach assets to the tag's Release.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No Apple Developer cert in CI — skip signing so the mac build runs.
          CSC_IDENTITY_AUTO_DISCOVERY: false

      # Safety net for re-runs and tag re-pushes: electron-builder refuses to
      # attach assets to a Release that was published more than ~2 hours ago
      # ("skipped publishing ... existing release published more than 2 hours
      # ago"). That once left v0.13.0 with no Linux artifacts after the tag was
      # moved and rebuilt. The files exist in build-output/ regardless, so push
      # them straight to the Release with the API, which has no such guard.
      # --clobber overwrites same-named assets so this is safe to re-run.
      #
      # GH_REPO is what keeps this working inside the Linux container. Without
      # it `gh` finds the repository by shelling out to git, and git refuses to
      # read a checkout owned by another uid — which is exactly the situation in
      # the container, where the workspace belongs to the runner user:
      #   fatal: detected dubious ownership in repository at '/__w/specterm/...'
      # Naming the repo outright skips that lookup entirely, and is narrower
      # than marking the tree safe globally just so one command can find it.
      - name: Ensure built artifacts are attached to the Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          shopt -s nullglob
          assets=(build-output/*.AppImage build-output/*.deb build-output/*.exe \
                  build-output/*.dmg build-output/*.zip build-output/latest*.yml \
                  build-output/*.blockmap)
          if [ ${#assets[@]} -eq 0 ]; then
            echo "No build artifacts found to upload." >&2
            exit 1
          fi
          gh release upload "$TAG" "${assets[@]}" --clobber

      # The Release body comes out empty, and the unsigned macOS build fails its
      # first launch with "Specterm is damaged and can't be opened" unless the
      # quarantine attribute is cleared. Seed the notes with that command so it
      # is on the download page itself, not only in the README. Runs on the mac
      # leg only (one writer), and appends — hand-written notes added later, or
      # by another leg, survive. See docs/macos-install.md.
      - name: Seed release notes with the macOS quarantine step
        if: runner.os == 'macOS' && startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          body=$(gh release view "$TAG" --json body --jq .body || echo "")
          case "$body" in
            *com.apple.quarantine*) echo "Already present; leaving notes alone."; exit 0 ;;
          esac
          { printf '%s' "$body"; cat .github/release-notes-macos.md; } > notes.md
          gh release edit "$TAG" --notes-file notes.md
